name: Process Google Drive Audio

on:
  repository_dispatch:
    types:
      - process_drive_audio

permissions:
  contents: write
  packages: read

jobs:
  process_drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install gdown
      run: |
        pip install gdown
        echo "✅ gdown installed"
    
    - name: Download from Google Drive
      id: download
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        mkdir -p data/audio
        
        echo "📥 Downloading from Google Drive..."
        echo "File ID: $DRIVE_FILE_ID"
        echo "Video ID: $VIDEO_ID"
        
        gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "data/audio/${VIDEO_ID}.m4a"
        
        if [ -f "data/audio/${VIDEO_ID}.m4a" ]; then
          echo "✅ Downloaded: ${VIDEO_ID}.m4a"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          echo "has_audio=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Download failed!"
          exit 1
        fi
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull AI Docker image
      run: |
        docker pull ghcr.io/pinyincode/subtitle-ai:latest || true
        echo "✅ Docker image ready"
    
    - name: Process audio with AI
      id: process
      env:
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        echo "🤖 Processing audio with AI..."
        mkdir -p output
        
        AUDIO_FILE="data/audio/${VIDEO_ID}.m4a"
        
        docker run --rm \
          -v $(pwd):/app \
          -w /app \
          ghcr.io/pinyincode/subtitle-ai:latest \
          python scripts/generate_subtitles.py \
          --audio "/app/$AUDIO_FILE" \
          --output "/app/output/${VIDEO_ID}.vtt"
        
        echo "📁 Checking output files:"
        ls -la output/
        
        if [ -f "output/${VIDEO_ID}.vtt" ]; then
          echo "✅ AI processing completed!"
          echo "has_subtitle=true" >> $GITHUB_OUTPUT
        else
          echo "❌ AI processing failed - VTT file not found!"
          echo "has_subtitle=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Upload subtitle to Gist
      if: steps.process.outputs.has_subtitle == 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        echo "📤 Uploading subtitle to Gist..."
        echo "📁 Files in output:"
        ls -la output/
        echo "🎯 Video ID: $VIDEO_ID"
        python scripts/push_to_gist.py
    
    - name: Notify completion
      if: steps.process.outputs.has_subtitle == 'true'
      run: |
        VIDEO_ID=${{ github.event.client_payload.video_id }}
        echo "🎉🎉🎉 Subtitle for ${VIDEO_ID} is ready!"
        echo "📁 Check your Gist: ${VIDEO_ID}.vtt"
    
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up temporary files..."
        rm -f data/audio/*.m4a
        touch data/audio/.gitkeep
        rm -f output/*.vtt
        rm -f output/*_summary.json
        touch output/.gitkeep
        echo "✅ Cleanup completed"
