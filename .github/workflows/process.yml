name: AI Subtitle Generator

on:
  push:
    paths:
      - data/audio/*.m4a
  workflow_dispatch:
  repository_dispatch:
    types:
      - process_audio
      - process_drive_audio

permissions:
  contents: write
  packages: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 👈 KIỂM TRA TOKEN TRÊN RUNNER
    - name: Debug - Check HF_TOKEN on runner
      run: |
        if [ -n "$HF_TOKEN" ]; then
          echo "✅ HF_TOKEN is set on runner (length: ${#HF_TOKEN})"
          echo "✅ Token prefix: ${HF_TOKEN:0:10}..."
        else
          echo "❌ HF_TOKEN is NOT set on runner!"
        fi
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    # 👈 NẾU LÀ DRIVE → TẢI FILE
    - name: Download from Google Drive (if drive event)
      if: github.event.action == 'process_drive_audio' || github.event.client_payload.drive_file_id
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        pip install gdown
        mkdir -p data/audio
        
        echo "📥 Downloading from Google Drive..."
        echo "File ID: $DRIVE_FILE_ID"
        echo "Video ID: $VIDEO_ID"
        
        gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "data/audio/${VIDEO_ID}.m4a"
        
        if [ -f "data/audio/${VIDEO_ID}.m4a" ]; then
          echo "✅ Downloaded: ${VIDEO_ID}.m4a"
        else
          echo "❌ Download failed!"
          exit 1
        fi
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull AI Docker image
      run: |
        docker pull ghcr.io/pinyincode/subtitle-ai:latest || true
        echo "✅ Docker image ready"
    
    - name: Process audio with AI
      id: process
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        AUDIO_FILE=$(find data/audio -name "*.m4a" -type f | head -1)
        
        if [ -n "$AUDIO_FILE" ]; then
          VIDEO_ID=$(basename "$AUDIO_FILE" .m4a)
          echo "🎬 Processing: $VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          
          mkdir -p output
          
          echo "📁 Running Docker container with HF_TOKEN..."
          
          # 👈 TRUYỀN HF_TOKEN VÀO CONTAINER
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            ghcr.io/pinyincode/subtitle-ai:latest \
            bash -c "
              echo '✅ HF_TOKEN inside container: length='\${#HF_TOKEN}
              echo '✅ Token prefix: '\${HF_TOKEN:0:10}
              python scripts/generate_subtitles.py --audio '/app/$AUDIO_FILE' --output '/app/output/${VIDEO_ID}.vtt'
            "
          
          echo "📁 Checking output files:"
          ls -la output/
          
          if [ -f "output/${VIDEO_ID}.vtt" ]; then
            echo "✅ Processing completed"
            echo "has_audio=true" >> $GITHUB_OUTPUT
          else
            echo "❌ VTT file NOT created!"
            echo "has_audio=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        else
          echo "ℹ️ No audio file found"
          echo "has_audio=false" >> $GITHUB_OUTPUT
        fi
    
    # ===== UPLOAD SUBTITLE TO GIST =====
    - name: Upload subtitle to Gist
      id: upload_gist
      if: steps.process.outputs.has_audio == 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VIDEO_ID: ${{ steps.process.outputs.video_id }}
      run: |
        echo "📤 Uploading subtitle to Gist..."
        echo "📁 Files in output:"
        ls -la output/
        echo "🎯 Video ID: $VIDEO_ID"
        
        # Chạy script upload
        python scripts/push_to_gist.py
        
        # Kiểm tra kết quả upload
        if [ $? -eq 0 ]; then
          echo "✅ Upload to Gist successful!"
          echo "gist_uploaded=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Upload to Gist FAILED!"
          echo "gist_uploaded=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    # ===== XÓA FILE TRÊN GOOGLE DRIVE VỚI OAUTH =====
    - name: Delete file from Google Drive (OAuth)
      if: |
        steps.upload_gist.outputs.gist_uploaded == 'true' && 
        github.event.action == 'process_drive_audio'
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        VIDEO_ID: ${{ steps.process.outputs.video_id }}
      run: |
        echo "🗑️ Deleting file from Google Drive using OAuth..."
        echo "📹 Video ID: $VIDEO_ID"
        echo "📎 File ID: $DRIVE_FILE_ID"
        
        # Kiểm tra secrets
        if [ -z "$OAUTH_CLIENT_ID" ] || [ -z "$OAUTH_CLIENT_SECRET" ] || [ -z "$OAUTH_REFRESH_TOKEN" ]; then
          echo "⚠️ OAuth credentials not configured, skipping delete"
          exit 0
        fi
        
        # Tạo script xóa với OAuth
        cat > /tmp/delete_oauth.py << 'EOF'
        import os, sys, json, time
        from google.oauth2.credentials import Credentials
        from google.auth.transport.requests import Request
        from googleapiclient.discovery import build
        from googleapiclient.errors import HttpError

        def delete_file_with_oauth(file_id, client_id, client_secret, refresh_token):
            try:
                # Tạo credentials từ refresh token
                creds = Credentials(
                    None,
                    refresh_token=refresh_token,
                    client_id=client_id,
                    client_secret=client_secret,
                    token_uri='https://oauth2.googleapis.com/token'
                )
                
                # Refresh để lấy access token mới
                creds.refresh(Request())
                
                # Khởi tạo service
                service = build('drive', 'v3', credentials=creds)
                
                print(f"🗑️ Deleting file: {file_id}")
                
                # Xóa file
                service.files().delete(
                    fileId=file_id,
                    supportsAllDrives=True
                ).execute()
                
                print(f"✅ File {file_id} deleted successfully!")
                
                # Xác minh file đã bị xóa
                try:
                    service.files().get(fileId=file_id).execute()
                    print(f"⚠️ File still exists! Deletion may have failed.")
                    return False
                except HttpError as verify_error:
                    if verify_error.resp.status == 404:
                        print(f"✅ Verified: File {file_id} is deleted")
                        return True
                    print(f"⚠️ Cannot verify: {verify_error}")
                    return True
                    
            except HttpError as error:
                error_code = error.resp.status
                if error_code == 404:
                    print(f"⚠️ File {file_id} not found (already deleted)")
                    return True
                if error_code == 403:
                    print(f"🚫 PERMISSION DENIED: {error}")
                    print(f"📌 Please check OAuth permissions")
                    return False
                print(f"❌ Google API error: {error}")
                return False
            except Exception as error:
                print(f"❌ Unexpected error: {error}")
                return False

        def main():
            file_id = os.getenv('DRIVE_FILE_ID')
            client_id = os.getenv('OAUTH_CLIENT_ID')
            client_secret = os.getenv('OAUTH_CLIENT_SECRET')
            refresh_token = os.getenv('OAUTH_REFRESH_TOKEN')
            
            if not all([file_id, client_id, client_secret, refresh_token]):
                print("❌ Missing OAuth credentials")
                sys.exit(1)
            
            success = delete_file_with_oauth(file_id, client_id, client_secret, refresh_token)
            sys.exit(0 if success else 1)

        if __name__ == "__main__":
            main()
        EOF
        
        # Cài đặt thư viện
        pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
        
        # Chạy script xóa
        python3 /tmp/delete_oauth.py
        
        if [ $? -eq 0 ]; then
          echo "✅ File deleted successfully from Google Drive!"
        else
          echo "❌ Failed to delete file!"
          exit 1
        fi
    
    - name: Cleanup
      if: always()
      run: |
        rm -f data/audio/*.m4a
        touch data/audio/.gitkeep
        rm -f output/*.vtt
        rm -f output/*_summary.json
        touch output/.gitkeep
        echo "✅ Cleaned up"
        
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add -A
        git diff --staged --quiet || (git commit -m "Cleanup [skip ci]" && git push) || echo "Push skipped"
