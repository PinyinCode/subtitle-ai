name: AI Subtitle Generator

on:
  push:
    paths:
      - data/audio/*.m4a
  workflow_dispatch:
  repository_dispatch:
    types:
      - process_audio
      - process_drive_audio

permissions:
  contents: write
  packages: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 👈 KIỂM TRA TOKEN TRÊN RUNNER
    - name: Debug - Check HF_TOKEN on runner
      run: |
        if [ -n "$HF_TOKEN" ]; then
          echo "✅ HF_TOKEN is set on runner (length: ${#HF_TOKEN})"
          echo "✅ Token prefix: ${HF_TOKEN:0:10}..."
        else
          echo "❌ HF_TOKEN is NOT set on runner!"
        fi
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    # 👈 NẾU LÀ DRIVE → TẢI FILE
    - name: Download from Google Drive (if drive event)
      if: github.event.action == 'process_drive_audio' || github.event.client_payload.drive_file_id
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        pip install gdown
        mkdir -p data/audio
        
        echo "📥 Downloading from Google Drive..."
        echo "File ID: $DRIVE_FILE_ID"
        echo "Video ID: $VIDEO_ID"
        
        gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "data/audio/${VIDEO_ID}.m4a"
        
        if [ -f "data/audio/${VIDEO_ID}.m4a" ]; then
          echo "✅ Downloaded: ${VIDEO_ID}.m4a"
        else
          echo "❌ Download failed!"
          exit 1
        fi
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull AI Docker image
      run: |
        docker pull ghcr.io/pinyincode/subtitle-ai:latest || true
        echo "✅ Docker image ready"
    
    - name: Process audio with AI
      id: process
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        AUDIO_FILE=$(find data/audio -name "*.m4a" -type f | head -1)
        
        if [ -n "$AUDIO_FILE" ]; then
          VIDEO_ID=$(basename "$AUDIO_FILE" .m4a)
          echo "🎬 Processing: $VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          
          mkdir -p output
          
          echo "📁 Running Docker container with HF_TOKEN..."
          
          # 👈 TRUYỀN HF_TOKEN VÀO CONTAINER
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            ghcr.io/pinyincode/subtitle-ai:latest \
            bash -c "
              echo '✅ HF_TOKEN inside container: length='\${#HF_TOKEN}
              echo '✅ Token prefix: '\${HF_TOKEN:0:10}
              python scripts/generate_subtitles.py --audio '/app/$AUDIO_FILE' --output '/app/output/${VIDEO_ID}.vtt'
            "
          
          echo "📁 Checking output files:"
          ls -la output/
          
          if [ -f "output/${VIDEO_ID}.vtt" ]; then
            echo "✅ Processing completed"
            echo "has_audio=true" >> $GITHUB_OUTPUT
          else
            echo "❌ VTT file NOT created!"
            echo "has_audio=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        else
          echo "ℹ️ No audio file found"
          echo "has_audio=false" >> $GITHUB_OUTPUT
        fi
    
    # ===== UPLOAD SUBTITLE TO GIST =====
    - name: Upload subtitle to Gist
      id: upload_gist
      if: steps.process.outputs.has_audio == 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VIDEO_ID: ${{ steps.process.outputs.video_id }}
      run: |
        echo "📤 Uploading subtitle to Gist..."
        echo "📁 Files in output:"
        ls -la output/
        echo "🎯 Video ID: $VIDEO_ID"
        
        # Chạy script upload
        python scripts/push_to_gist.py
        
        # Kiểm tra kết quả upload
        if [ $? -eq 0 ]; then
          echo "✅ Upload to Gist successful!"
          echo "gist_uploaded=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Upload to Gist FAILED!"
          echo "gist_uploaded=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    # ===== 🆕 XÓA FILE TRÊN GOOGLE DRIVE (XÓA THỰC SỰ) =====
    - name: Delete file from Google Drive
      if: |
        steps.upload_gist.outputs.gist_uploaded == 'true' && 
        github.event.action == 'process_drive_audio'
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
        VIDEO_ID: ${{ steps.process.outputs.video_id }}
      run: |
        echo "🗑️ Deleting file from Google Drive..."
        echo "📹 Video ID: $VIDEO_ID"
        echo "📎 File ID: $DRIVE_FILE_ID"
        
        # Kiểm tra secret có tồn tại không
        if [ -z "$DRIVE_SERVICE_ACCOUNT_KEY" ]; then
          echo "⚠️ DRIVE_SERVICE_ACCOUNT_KEY not configured, skipping delete"
          exit 0
        fi
        
        # 🆕 Tạo script xóa thực sự (inline)
        cat > /tmp/delete_drive_real.py << 'EOF'
        #!/usr/bin/env python3
        """
        Xóa file trên Google Drive - Xóa thực sự (vĩnh viễn)
        """
        
        import os
        import json
        import sys
        import time
        from google.oauth2.service_account import Credentials
        from googleapiclient.discovery import build
        from googleapiclient.errors import HttpError
        
        def delete_file_real(file_id, service_account_key, retry_count=3):
            """
            Xóa file thực sự trên Google Drive
            """
            for attempt in range(retry_count):
                try:
                    # Parse service account key
                    if isinstance(service_account_key, str):
                        service_account_info = json.loads(service_account_key)
                    else:
                        service_account_info = service_account_key
                    
                    # Tạo credentials với quyền đầy đủ
                    creds = Credentials.from_service_account_info(
                        service_account_info,
                        scopes=['https://www.googleapis.com/auth/drive']  # Quyền đầy đủ
                    )
                    
                    # Khởi tạo Drive service
                    service = build('drive', 'v3', credentials=creds)
                    
                    # 🔥 Gọi API DELETE - XÓA THỰC SỰ
                    print(f"🗑️ Attempt {attempt + 1}: Deleting file {file_id}...")
                    service.files().delete(fileId=file_id).execute()
                    
                    print(f"✅ Successfully DELETED file: {file_id}")
                    return True
                    
                except HttpError as error:
                    error_code = error.resp.status
                    error_msg = error._get_reason()
                    
                    if error_code == 404:
                        print(f"⚠️ File {file_id} not found (may have been deleted already)")
                        # Kiểm tra xem file có thực sự tồn tại không
                        try:
                            # Thử lấy thông tin file để xác minh
                            service.files().get(fileId=file_id).execute()
                            print(f"❌ File exists but cannot be deleted!")
                            return False
                        except HttpError as verify_error:
                            if verify_error.resp.status == 404:
                                print(f"✅ File {file_id} is confirmed deleted (404 not found)")
                                return True
                            print(f"⚠️ Cannot verify file status: {verify_error}")
                            return False
                        
                    if error_code == 403:
                        print(f"🚫 PERMISSION DENIED: {error_msg}")
                        print(f"📌 Service Account needs EDITOR or MANAGER permission")
                        return False
                        
                    if error_code == 429:  # Rate limit
                        if attempt < retry_count - 1:
                            wait_time = 2 ** (attempt + 1)
                            print(f"⏳ Rate limit, retry in {wait_time}s...")
                            time.sleep(wait_time)
                            continue
                    
                    print(f"❌ Error: {error_code} - {error_msg}")
                    if attempt < retry_count - 1:
                        wait_time = 2 ** attempt
                        print(f"⏳ Retry in {wait_time}s...")
                        time.sleep(wait_time)
                    else:
                        return False
                        
                except Exception as error:
                    print(f"❌ Unexpected error: {error}")
                    if attempt < retry_count - 1:
                        wait_time = 2 ** attempt
                        print(f"⏳ Retry in {wait_time}s...")
                        time.sleep(wait_time)
                    else:
                        return False
            
            return False
        
        def main():
            """Main function"""
            file_id = os.getenv('DRIVE_FILE_ID')
            service_account_key = os.getenv('DRIVE_SERVICE_ACCOUNT_KEY')
            
            if not file_id:
                print("❌ DRIVE_FILE_ID environment variable is required")
                sys.exit(1)
            
            if not service_account_key:
                print("❌ DRIVE_SERVICE_ACCOUNT_KEY environment variable is required")
                print("💡 Add it to GitHub Secrets: Settings → Secrets → Actions")
                sys.exit(1)
            
            print(f"🗑️ Starting file deletion: {file_id}")
            print(f"⏰ Time: {time.strftime('%Y-%m-%d %H:%M:%S')}")
            
            # Thực hiện xóa
            success = delete_file_real(file_id, service_account_key)
            
            if success:
                print(f"✅ File {file_id} has been permanently deleted from Google Drive")
                sys.exit(0)
            else:
                print(f"❌ Failed to delete file {file_id} after retries")
                print(f"💡 Please check:")
                print(f"   1. Service Account has permission (Editor/Manager)")
                print(f"   2. File exists and is accessible")
                print(f"   3. File ID is correct: {file_id}")
                sys.exit(1)
        
        if __name__ == "__main__":
            main()
        EOF
        
        # Cài đặt thư viện Google API
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        
        # Chạy script xóa thực sự
        python3 /tmp/delete_drive_real.py
        
        # 🆕 KIỂM TRA KẾT QUẢ XÓA
        if [ $? -eq 0 ]; then
          echo "✅ File deleted successfully from Google Drive!"
          echo "📌 Please verify on Drive: https://drive.google.com/drive/folders/"
        else
          echo "❌ Failed to delete file!"
          echo "⚠️ File may still exist on Google Drive"
          echo "🔍 Please check manually: https://drive.google.com/drive/folders/"
          exit 1  # Dừng workflow nếu xóa thất bại
        fi
    
    - name: Cleanup
      if: always()
      run: |
        rm -f data/audio/*.m4a
        touch data/audio/.gitkeep
        rm -f output/*.vtt
        rm -f output/*_summary.json
        touch output/.gitkeep
        echo "✅ Cleaned up"
        
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add -A
        git diff --staged --quiet || (git commit -m "Cleanup [skip ci]" && git push) || echo "Push skipped"
