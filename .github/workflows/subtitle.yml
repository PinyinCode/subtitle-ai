name: AI Subtitle Generator
on:
  push:
    paths:
    - data/audio/*.m4a
  workflow_dispatch:
  repository_dispatch:
    types:
    - process_audio
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/pinyincode/subtitle-ai:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    
    - run: |
        mkdir -p output
        AUDIO=$(find data/audio -name "*.m4a" -type f | head -1)
        if [ -n "$AUDIO" ]; then python scripts/generate_subtitles.py; fi
    
    - env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      if: always()
      run: python scripts/push_to_gist.py
    
    - if: always()
      run: |
        rm -f data/audio/*.m4a data/audio/*.json
        touch data/audio/.gitkeep
        rm -f output/*.vtt output/*_summary.json
        touch output/.gitkeep
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add -A
        git diff --staged --quiet || (git commit -m "Cleanup [skip ci]" && git push) || echo "Push skipped"
