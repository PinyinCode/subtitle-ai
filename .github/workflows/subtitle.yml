 gist name: AI Subtitle Generator
on:
  push:
    paths:
      - 'data/audio/*.m4a'
  workflow_dispatch:
  repository_dispatch:
    types: [process_audio]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
    
    - name: Install Python packages
      run: |
        pip install --quiet --upgrade pip
        pip install --quiet openai-whisper
        pip install --quiet deep-translator
        pip install --quiet pypinyin
        pip install --quiet PyGithub
    
    - name: Find audio files
      id: find-audio
      run: |
        mkdir -p output
        AUDIO=$(find data/audio -name "*.m4a" -type f | head -1)
        echo "audio_file=$AUDIO" >> $GITHUB_OUTPUT
    
    - name: Generate subtitles
      if: steps.find-audio.outputs.audio_file != ''
      run: python scripts/generate_subtitles.py
    
    - name: Push to Gist
      if: always()
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      run: |
        if [ -n "$GIST_TOKEN" ]; then
          python scripts/push_to_gist.py
        fi
    
    - name: Cleanup
      if: always()
      run: |
        rm -f data/audio/*.m4a
        rm -f data/audio/*.json
        touch data/audio/.gitkeep
        
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes"
        else
          git commit -m "Subtitle + cleanup [skip ci]"
          git push origin main --force
        fi
