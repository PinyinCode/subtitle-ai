name: AI Subtitle Generator

on:
  push:
    paths:
      - data/audio/*.m4a
  workflow_dispatch:
  repository_dispatch:
    types:
      - process_audio
      - process_drive_audio  # 👈 THÊM EVENT CHO GOOGLE DRIVE

permissions:
  contents: write
  packages: read

jobs:
  # ===== JOB 1: XỬ LÝ AUDIO TỪ PUSH/UPLOAD =====
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull AI Docker image
      run: |
        docker pull ghcr.io/pinyincode/subtitle-ai:latest || true
        echo "✅ Docker image ready"
    
    - name: Process audio with AI
      id: process
      run: |
        AUDIO_FILE=$(find data/audio -name "*.m4a" -type f | head -1)
        
        if [ -n "$AUDIO_FILE" ]; then
          VIDEO_ID=$(basename "$AUDIO_FILE" .m4a)
          echo "🎬 Processing: $VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            ghcr.io/pinyincode/subtitle-ai:latest \
            python scripts/generate_subtitles.py \
            --audio "/app/$AUDIO_FILE" \
            --output "/app/output/${VIDEO_ID}.vtt"
          
          echo "✅ Processing completed"
          echo "has_audio=true" >> $GITHUB_OUTPUT
        else
          echo "ℹ️ No audio file found"
          echo "has_audio=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Upload subtitle to Gist
      if: steps.process.outputs.has_audio == 'true'
      env:
        GH_TOKEN: ${{ secrets.GIST_TOKEN }}
      run: |
        python scripts/push_to_gist.py 2>/dev/null || echo "Gist skipped"
    
    - name: Cleanup
      if: always()
      run: |
        rm -f data/audio/*.m4a
        touch data/audio/.gitkeep
        
        rm -f output/*.vtt
        rm -f output/*_summary.json
        touch output/.gitkeep
        
        echo "✅ Cleaned up"
        
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add -A
        git diff --staged --quiet || (git commit -m "Cleanup [skip ci]" && git push) || echo "Push skipped"

  # ===== JOB 2: XỬ LÝ AUDIO TỪ GOOGLE DRIVE =====
  process_drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.action == 'process_drive_audio' || github.event.client_payload.drive_file_id
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install gdown
      run: |
        pip install gdown
        echo "✅ gdown installed"
    
    - name: Download from Google Drive
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        mkdir -p data/audio
        
        echo "📥 Downloading from Google Drive..."
        echo "File ID: $DRIVE_FILE_ID"
        echo "Video ID: $VIDEO_ID"
        
        # Tải từ Google Drive
        gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "data/audio/${VIDEO_ID}.m4a"
        
        if [ -f "data/audio/${VIDEO_ID}.m4a" ]; then
          echo "✅ Downloaded: ${VIDEO_ID}.m4a"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          echo "has_audio=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Download failed!"
          exit 1
        fi
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull AI Docker image
      run: |
        docker pull ghcr.io/pinyincode/subtitle-ai:latest || true
        echo "✅ Docker image ready"
    
    - name: Process audio with AI
      id: process
      env:
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        echo "🤖 Processing audio with AI..."
        mkdir -p output
        
        docker run --rm \
          -v $(pwd):/app \
          -w /app \
          ghcr.io/pinyincode/subtitle-ai:latest \
          python scripts/generate_subtitles.py \
          --audio "/app/data/audio/${VIDEO_ID}.m4a" \
          --output "/app/output/${VIDEO_ID}.vtt"
        
        if [ -f "output/${VIDEO_ID}.vtt" ]; then
          echo "✅ AI processing completed!"
          echo "has_subtitle=true" >> $GITHUB_OUTPUT
        else
          echo "❌ AI processing failed!"
          exit 1
        fi
    
    - name: Upload subtitle to Gist
      if: steps.process.outputs.has_subtitle == 'true'
      env:
        GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        echo "📤 Uploading subtitle to Gist..."
        python scripts/push_to_gist.py
    
    - name: Notify completion
      if: steps.process.outputs.has_subtitle == 'true'
      run: |
        VIDEO_ID=${{ github.event.client_payload.video_id }}
        echo "🎉🎉🎉 Subtitle for ${VIDEO_ID} is ready!"
        echo "📁 Check your Gist: ${VIDEO_ID}.vtt"
    
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up temporary files..."
        rm -f data/audio/*.m4a
        touch data/audio/.gitkeep
        rm -f output/*.vtt
        rm -f output/*_summary.json
        touch output/.gitkeep
        echo "✅ Cleanup completed"
