name: Process Google Drive Audio

on:
  repository_dispatch:
    types:
      - process_drive_audio

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install gdown
      run: |
        pip install gdown
        echo "✅ gdown installed"
    
    - name: Download from Google Drive
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        VIDEO_ID: ${{ github.event.client_payload.video_id }}
      run: |
        mkdir -p data/audio
        
        echo "📥 Downloading from Google Drive..."
        echo "File ID: $DRIVE_FILE_ID"
        echo "Video ID: $VIDEO_ID"
        
        # Tải file từ Google Drive
        gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "data/audio/${VIDEO_ID}.m4a"
        
        if [ -f "data/audio/${VIDEO_ID}.m4a" ]; then
          echo "✅ Downloaded: ${VIDEO_ID}.m4a"
          echo "✅ File saved to data/audio/${VIDEO_ID}.m4a"
        else
          echo "❌ Download failed!"
          exit 1
        fi
    
    - name: Commit and push audio file
      run: |
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add data/audio/*.m4a
        git diff --staged --quiet || (git commit -m "Add audio from Google Drive [skip ci]" && git push) || echo "No changes to commit"
        
        echo "✅ Audio file committed to repository"
