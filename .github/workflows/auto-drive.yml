name: Auto Process from Drive

on:
  repository_dispatch:
    types:
      - new_drive_file

permissions:
  contents: write
  packages: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 👈 ĐỊNH NGHĨA TÊN IMAGE (CHỮ THƯỜNG)
    - name: Set image name
      id: image
      run: |
        echo "image=ghcr.io/${{ github.repository_owner }}/subtitle-ai" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        echo "✅ Image: ${{ steps.image.outputs.image }}"
    
    # 👈 TẠO LOCK ĐỂ TRÁNH XỬ LÝ TRÙNG
    - name: Create processing lock
      env:
        FILE_NAME: ${{ github.event.client_payload.file_name }}
      run: |
        mkdir -p .processing
        echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > ".processing/${FILE_NAME}.lock"
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add .processing/
        git diff --staged --quiet || (git commit -m "Lock: Processing ${FILE_NAME}" && git push) || echo "Lock already exists"
    
    # 👈 TẢI AUDIO TỪ GOOGLE DRIVE (GIỮ TÊN GỐC)
    - name: Download from Google Drive
      env:
        DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id }}
        FILE_NAME: ${{ github.event.client_payload.file_name }}
      run: |
        pip install gdown
        mkdir -p data/audio
        
        echo "📥 Downloading from Google Drive..."
        echo "File ID: $DRIVE_FILE_ID"
        echo "File Name: $FILE_NAME"
        
        # 👈 TẢI VỚI TÊN GỐC
        gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "data/audio/${FILE_NAME}"
        
        if [ -f "data/audio/${FILE_NAME}" ]; then
          echo "✅ Downloaded: ${FILE_NAME}"
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
        else
          echo "❌ Download failed!"
          exit 1
        fi
    
    # 👈 LOGIN GHCR
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # 👈 PULL DOCKER IMAGE
    - name: Pull AI Docker image
      run: |
        docker pull ${{ steps.image.outputs.image }}:latest || true
        echo "✅ Docker image ready"
    
    # 👈 XỬ LÝ AUDIO VỚI AI (GIỮ TÊN GỐC)
    - name: Process audio with AI
      id: process
      env:
        FILE_NAME: ${{ steps.download.outputs.file_name }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "🤖 Processing audio with AI..."
        mkdir -p output
        AUDIO_FILE="data/audio/${FILE_NAME}"
        
        if [ ! -f "$AUDIO_FILE" ]; then
          echo "❌ Audio file not found: $AUDIO_FILE"
          exit 1
        fi
        
        echo "📁 Audio file: $FILE_NAME"
        
        # 👈 CHẠY DOCKER VỚI TÊN FILE GỐC
        docker run --rm \
          -v $(pwd):/app \
          -w /app \
          -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
          -e ORIGINAL_FILENAME="$FILE_NAME" \
          ${{ steps.image.outputs.image }}:latest \
          bash -c "
            echo '✅ HF_TOKEN inside container: length='\${#HF_TOKEN}
            python scripts/generate_subtitles.py --audio '/app/$AUDIO_FILE'
          "
        
        # 👈 KIỂM TRA FILE VTT (TÊN GỐC, KHÔNG EXTENSION)
        NAME_WITHOUT_EXT="${FILE_NAME%.*}"
        echo "📝 Tên file VTT sẽ là: ${NAME_WITHOUT_EXT}.vtt"
        
        if [ -f "output/${NAME_WITHOUT_EXT}.vtt" ]; then
          echo "✅ AI processing completed!"
          echo "has_subtitle=true" >> $GITHUB_OUTPUT
          echo "output_filename=${NAME_WITHOUT_EXT}" >> $GITHUB_OUTPUT
          
          # 👈 ĐỌC YOUTUBE LINK TỪ FILE INFO
          if [ -f "output/${NAME_WITHOUT_EXT}.info.txt" ]; then
            YOUTUBE_LINK=$(grep "YouTube Link:" "output/${NAME_WITHOUT_EXT}.info.txt" | cut -d' ' -f3-)
            echo "🔗 YouTube: $YOUTUBE_LINK"
            echo "youtube_link=$YOUTUBE_LINK" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ AI processing failed!"
          echo "has_subtitle=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    # 👈 UPLOAD LÊN GIST (DÙNG TÊN GỐC)
    - name: Upload subtitle to Gist
      if: steps.process.outputs.has_subtitle == 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FILE_NAME: ${{ steps.download.outputs.file_name }}
        OUTPUT_FILENAME: ${{ steps.process.outputs.output_filename }}
        YOUTUBE_LINK: ${{ steps.process.outputs.youtube_link }}
      run: |
        echo "📤 Uploading subtitle to Gist..."
        echo "📁 File gốc: $FILE_NAME"
        echo "📝 Tên VTT: ${OUTPUT_FILENAME}.vtt"
        echo "🔗 YouTube: $YOUTUBE_LINK"
        
        # 👈 KIỂM TRA FILE VTT
        if [ ! -f "output/${OUTPUT_FILENAME}.vtt" ]; then
          echo "❌ VTT file not found!"
          exit 1
        fi
        
        # 👈 CHẠY SCRIPT UPLOAD
        python scripts/push_to_gist.py
        
        if [ $? -eq 0 ]; then
          echo "✅ Upload to Gist successful!"
          echo "gist_uploaded=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Upload to Gist FAILED!"
          echo "gist_uploaded=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    # 👈 XÓA LOCK (DÙNG TÊN GỐC)
    - name: Remove processing lock
      if: always()
      env:
        FILE_NAME: ${{ github.event.client_payload.file_name }}
      run: |
        rm -f ".processing/${FILE_NAME}.lock"
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add .processing/
        git diff --staged --quiet || (git commit -m "Unlock: ${FILE_NAME}" && git push) || echo "No lock to remove"
    
    # 👈 DỌN DẸP
    - name: Cleanup
      if: always()
      run: |
        rm -f data/audio/*.m4a data/audio/*.mp3 data/audio/*.wav
        touch data/audio/.gitkeep
        rm -f output/*.vtt
        rm -f output/*_summary.json
        rm -f output/*.info.txt
        touch output/.gitkeep
        echo "✅ Cleaned up"
